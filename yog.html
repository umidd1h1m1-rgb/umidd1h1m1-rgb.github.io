<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15293f">
<title>Yog' tayyorlash — kompyuter</title>
<style>
:root{--bg:#eef2f7;--panel:#fff;--ink:#17212e;--muted:#5b6878;--line:#dbe2ea;--head:#15293f;--a:#e3a43a;--b:#3a8fd6;--c:#2fa36b;--bad:#d64545;--ok:#1f9d5c;--sh:0 8px 24px rgba(21,41,63,.08),0 1px 3px rgba(21,41,63,.06)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;color:var(--ink);font:18px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  background:radial-gradient(1200px 500px at 85% -10%,#dfe9f6 0%,transparent 60%),linear-gradient(180deg,#eef2f7 0%,#f7f9fc 100%);min-height:100vh}
header{position:relative;overflow:hidden;color:#fff;padding:18px 32px 0;
  background:linear-gradient(120deg,#0f2236 0%,#17324f 55%,#22507a 100%)}
header::before,header::after{content:"";position:absolute;border-radius:50%;pointer-events:none}
header::before{width:420px;height:420px;right:-120px;top:-260px;border:46px solid rgba(227,164,58,.16)}
header::after{width:260px;height:260px;right:220px;top:-190px;border:28px solid rgba(58,143,214,.18)}
.hrow{position:relative;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#f0b24a,#c97f17);box-shadow:0 6px 18px rgba(0,0,0,.25)}
.logo svg{width:34px;height:34px}
header h1{margin:0;font-size:1.6rem;letter-spacing:-.01em}
header .by{font-size:.92rem;opacity:.75}
.clock{text-align:right}
.clock b{font-size:1.5rem;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.clock div{font-size:.9rem;opacity:.75}
header button{font:inherit;font-size:.95rem;background:rgba(255,255,255,.08);color:#fff;border:1.5px solid rgba(255,255,255,.3);border-radius:10px;padding:8px 14px;cursor:pointer}
header button:hover{background:rgba(255,255,255,.16)}
nav{position:relative;display:flex;gap:6px;margin-top:16px}
nav button{font:inherit;font-size:1.02rem;font-weight:600;color:rgba(255,255,255,.75);background:transparent;border:0;border-radius:12px 12px 0 0;padding:12px 22px;cursor:pointer}
nav button[aria-pressed="true"]{background:#eef2f7;color:var(--head)}
nav .sp{flex:1}
.setg{max-width:1880px;margin:0 auto;padding:22px 28px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:22px;align-items:start}
.grp{margin:16px 0 6px;font-size:1rem;color:var(--head);display:flex;align-items:center;gap:8px}
.grp i{width:12px;height:12px;border-radius:3px;background:var(--a)}.grp i.d{background:var(--c)}
.it{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:#fbfcfe}
.it .nm{font-weight:700}.it .pr{font-weight:500;color:var(--muted);font-size:.92rem;margin-left:6px}
.it .ds{color:var(--muted);font-size:.9rem}
.it .ac{display:flex;gap:6px;flex:none}
.mini{font:inherit;font-size:.9rem;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 12px;cursor:pointer}
.mini.del{color:var(--bad)}
.warn{background:#fff6dd;color:#7a5200;border:1px solid #f1d58a;border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:1rem}
.warn.danger{background:#fdecec;color:#9b1c1c;border-color:#f3b4b4}
.adrow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;margin-bottom:8px;align-items:stretch}
.adtot{margin-top:6px;color:var(--muted)}
.adset{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto;gap:8px;margin-bottom:8px;align-items:center}
@media (max-width:760px){.adrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto}.adrow>.inp:first-child{grid-column:1/-1}}
.inp.bad{border-color:var(--bad)!important;background:#fff1f1}
.xr{margin-top:10px}.xr .mini{height:46px}
.seg{display:flex;gap:6px}.seg button{flex:1;font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--head);color:#fff;border-color:var(--head)}
.frm .f2>div{margin-bottom:10px}
.lang{display:flex;gap:4px;margin:0 8px 8px 0;align-self:center}
.lang button{border:1.5px solid rgba(255,255,255,.3);border-radius:9px;padding:6px 12px;font-size:.9rem;color:#fff;background:transparent;cursor:pointer}
.lang button[aria-pressed="true"]{background:#e3a43a;border-color:#e3a43a;color:#1b1205}
main{max-width:1880px;margin:0 auto;padding:22px 28px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
.card{background:var(--panel);border:1px solid rgba(219,226,234,.8);border-radius:18px;padding:20px 22px;margin-bottom:18px;box-shadow:var(--sh)}
.card h2{margin:0 0 14px;font-size:1.15rem;display:flex;align-items:center;gap:10px}
.n{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:linear-gradient(145deg,#22507a,#15293f);color:#fff;font-size:.95rem;flex:none}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.lbls{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-size:.82rem;color:var(--muted);margin:0 0 -4px;padding-left:2px}
.lbls span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,2fr);gap:8px;margin-bottom:8px;align-items:end}
.trow .tr3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trow .inp input,.trow .inp select{padding:9px 8px;font-size:1.05rem}
.trow .inp span{padding:0 6px;font-size:.85rem}.trow .inp .pre{padding:0 0 0 8px;font-weight:700;color:var(--head)}
.trow .x,.adrow .x{border:0;background:#fdecec;color:var(--bad);border-radius:10px;font-size:1.1rem;padding:0 12px;cursor:pointer;height:100%}
.trow.xt{grid-template-columns:minmax(0,1.1fr) minmax(0,2fr) auto}
.comp.c{border-color:var(--c)}.out1{background:#e7f6ee;border-color:#bfe5cf}.out1 input{font-weight:700;color:#145c37}
.thd{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}.thd .t{margin:0}
.restl{display:none!important;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:0}.restl .inp{width:118px}.restl .inp input{padding:6px 4px;font-size:1rem;width:100%}.restl .inp span{padding:0 6px}
.out1.zero{background:#f1f3f6;border-color:var(--line)}.out1.zero input{color:var(--muted);font-weight:500}
.out1.done{background:#e7f6ee;border-color:#7cc9a0}
.rz.zero{background:#f1f3f6;color:var(--muted)}
.comp{background:linear-gradient(90deg,rgba(227,164,58,.07),transparent 40%);border-radius:0 12px 12px 0}
.comp.b{background:linear-gradient(90deg,rgba(58,143,214,.08),transparent 40%)}
.comp.c{background:linear-gradient(90deg,rgba(47,163,107,.08),transparent 40%)}
.comp .t{color:var(--head);font-size:1.1rem}
.comp:not(.b):not(.c) .t::before,.comp.b .t::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--a);margin-right:8px;vertical-align:middle}
.comp.b .t::before{background:var(--b)}
.rz{margin:-2px 0 10px;font-size:1rem;color:#145c37;background:#e7f6ee;border-radius:9px;padding:6px 10px}.rz:empty{display:none}.rz b{font-size:1.1rem}
.tinfo{margin-top:8px;font-size:1rem;color:var(--head);background:#f2f6fb;border-radius:10px;padding:8px 12px}
.tinfo:empty{display:none}
.tinfo b{font-size:1.08rem}
.big2{font-size:1.15rem;line-height:1.5}
.rep{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr)}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:6px 0 14px}
.kpi>div{border-radius:14px;padding:14px 16px;background:linear-gradient(160deg,#f3f7fb,#e8eff7)}
.kpi .lb{color:var(--muted);font-size:.92rem}.kpi .vv{font-size:2rem;font-weight:800;line-height:1.15}.kpi .vv small{font-size:1rem;color:var(--muted)}
.arcEd{border:0;background:#eef2f7;border-radius:8px;padding:4px 9px;font:inherit;font-size:.95rem;cursor:pointer}
.lock{font-size:.9rem;color:var(--muted);margin-left:auto;font-weight:400}

label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px;font-weight:500}
.inp{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:11px;background:#fafbfc}
.inp:focus-within{border-color:var(--a)}
.inp input,.inp select{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:1.1rem;padding:11px 12px;color:inherit;outline:none}
.inp span{padding:0 12px;color:var(--muted);font-size:.95rem;white-space:nowrap}
.comp{border-left:6px solid var(--a);padding:6px 0 6px 14px;margin:6px 0 14px}
.comp.b{border-color:var(--b)}
.comp .t{font-weight:700;margin-bottom:8px}
.norm{color:var(--muted);font-size:.95rem;margin-top:8px}
.res{position:sticky;top:18px}
.res .card{padding:24px 26px;border-top:6px solid var(--a)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.tile{border-radius:16px;padding:16px 18px;background:linear-gradient(160deg,#fff8ea,#fbefd5);border:1px solid #f1dfb8}
.tile.b{background:linear-gradient(160deg,#eef6fd,#dcecfa);border-color:#c8def3}
.pbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:#e6ebf1;margin:0 0 16px}
.pbar i{display:block;height:100%;transition:width .3s}
.pbar .x{background:linear-gradient(90deg,#f0b24a,#d98f22)}.pbar .y{background:linear-gradient(90deg,#4ea1e3,#2f7fc4)}
.calcs{max-width:1880px;margin:0 auto;padding:22px 28px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px;align-items:start}
.calcs .card{min-height:100%}
.out{margin-top:6px;border-radius:14px;background:linear-gradient(160deg,#f3f7fb,#e8eff7);padding:14px 16px}
.out .lb{color:var(--muted);font-size:.92rem}
.out .vv{font-size:2.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.out .vv small{font-size:1rem;color:var(--muted);font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f2>div,.calcs .card>div.fl{margin-bottom:12px}
footer{max-width:1880px;margin:0 auto;padding:4px 28px 28px;color:var(--muted);font-size:.9rem;display:flex;justify-content:space-between}
@media print{header nav,header button,#setBtn,.row,#shiftMsg,footer{display:none!important}body{background:#fff}.card{box-shadow:none}main,.calcs{padding:0}}
.tile .nm{font-weight:600;color:var(--muted);font-size:.95rem}
.tile .v{font-size:2.6rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.tile .v small{font-size:1.1rem;font-weight:600;color:var(--muted)}
.tile .s{font-size:1rem}
.tile .z{font-size:1.05rem;margin-top:6px}
.tile .z b{font-size:1.2rem}
.line{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:1.05rem}
.line b{font-size:1.2rem}
.okb{color:var(--ok);font-weight:700}.badb{color:var(--bad);font-weight:700}
.msg{background:#fdecec;color:#8f1f1f;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:1rem}
.okmsg{background:#e7f6ee;color:#145c37;border-radius:12px;padding:12px 14px;margin:10px 0;font-size:1rem}
.btn{font:inherit;font-size:1.05rem;font-weight:600;border:0;border-radius:12px;padding:13px 20px;background:var(--head);color:#fff;cursor:pointer}
.btn.sec{background:#e6eaf0;color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.wide{grid-column:1/-1}
table{width:100%;border-collapse:collapse;font-size:.98rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.9rem}
td.num{text-align:right;white-space:nowrap}
.empty{color:var(--muted);padding:6px 0}
textarea{width:100%;min-height:160px;font:inherit;font-size:.95rem;border:1.5px solid var(--line);border-radius:11px;padding:10px;background:#fafbfc}
dialog{border:0;border-radius:16px;padding:22px;max-width:640px;width:92%}
dialog::backdrop{background:rgba(20,28,40,.45)}
@media (min-width:1600px){main{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;padding:26px 36px}body{font-size:19px}.trow{grid-template-columns:minmax(0,1fr) minmax(0,2.2fr)}}
@media (max-width:1050px){main{grid-template-columns:minmax(0,1fr)}.res{position:static}.calcs,.setg{grid-template-columns:minmax(0,1fr)}}
/* ===== TELEFON ===== */
@media (max-width:760px){
  body{font-size:17px}
  header{padding:12px 16px 0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  header::before,header::after{display:none}
  .hrow{flex-direction:column;align-items:flex-start;gap:8px}
  header h1{font-size:1.3rem}.logo{width:46px;height:46px}.logo svg{width:28px;height:28px}
  .clock{position:static;align-self:stretch;display:flex;align-items:baseline;gap:10px;text-align:left;padding:6px 10px;border-radius:10px;background:rgba(255,255,255,.08)}
  .clock b{font-size:1.1rem}.clock div{font-size:.85rem}
  nav{flex-wrap:wrap;gap:4px;margin-top:12px}
  nav button{flex:1;min-width:44%;padding:11px 10px;font-size:.95rem;border-radius:11px}
  nav .sp{display:none}
  nav #prtBtn{display:none}
  .lang{order:-1;margin:0 0 4px}
  main,.calcs,.setg{padding:14px 14px 90px;gap:14px}
  .card{padding:15px 15px;border-radius:14px}
  .card h2{font-size:1.08rem}
  .grid4,.f2{grid-template-columns:minmax(0,1fr);gap:10px}
  .grid3{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr);gap:6px}
  .grid3 label{font-size:.78rem;min-height:2.3em;display:flex;align-items:flex-end;margin-bottom:4px;line-height:1.15}
  .grid3 .inp input,.grid3 .inp select{padding:10px 6px;font-size:16px}.grid3 .inp span{padding:0 5px;font-size:.8rem}
  .grid4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.grid4>div:first-child{grid-column:1/-1}
  label{overflow-wrap:anywhere}
  .grid4 .xr,.xr{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .rep{grid-template-columns:minmax(0,1fr)}
  .trow,.trow.xt{grid-template-columns:minmax(0,1fr) auto;gap:6px}.trow>.inp{grid-column:1/2}.trow .tr3{grid-column:1/-1;gap:6px}
  .trow:not(.xt)>.inp{grid-column:1/-1}
  .trow.xt .x{grid-column:2;grid-row:1;height:44px}
  .trow .inp input{font-size:17px;padding:10px 6px}
  .lbl-m{display:block}
  nav button[data-v]{min-width:46%}
  /* arxiv telefonda kartochka ko'rinishida */
  #arc table,#arc tbody,#arc tr,#arc td,.rtab table,.rtab tbody,.rtab tr,.rtab td{display:block;width:100%}
  #arc thead,.rtab thead{display:none}
  #arc tr,.rtab tr{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px;background:#fbfcfe}
  #arc td,.rtab td{border:0;padding:3px 0;text-align:left!important;white-space:normal}
  #arc td[data-l]::before,.rtab td[data-l]::before{content:attr(data-l)': ';color:var(--muted);font-size:.85rem}
  .kpi .vv{font-size:1.7rem}
  .inp input,.inp select{font-size:17px;padding:13px 12px}
  .big{grid-template-columns:1fr;gap:12px}
  .tile .v{font-size:2.1rem}
  .res .card{border-top-width:5px}
  .row{gap:8px}.row .btn{flex:1;min-width:46%;padding:13px 12px;font-size:1rem}
  table{font-size:.86rem}th,td{padding:7px 6px}
  footer{flex-direction:column;gap:4px;padding:4px 16px 24px;font-size:.82rem}
  dialog{width:94%;max-width:none;padding:18px;border-radius:16px}
  .seg button{padding:12px}
  /* pastki yopishgan menyu */
  nav{position:sticky;top:0;z-index:30;background:linear-gradient(120deg,#0f2236,#17324f);padding-bottom:2px}
}
@media (max-width:420px){nav button{font-size:.88rem;min-width:46%}.tile .v{font-size:1.9rem}}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#1b1205" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c3.5 4.4 6 7.9 6 11a6 6 0 0 1-12 0c0-3.1 2.5-6.6 6-11z"/><path d="M9.2 14.6a2.9 2.9 0 0 0 2.8 2.4"/></svg></div>
      <div><h1 data-t="title"></h1><div class="by"><span data-t="unit"></span> · Abduzuxurov Umidjon</div></div>
    </div>
    <div class="clock"><b id="clk">--:--</b><div id="dte"></div></div>
  </div>
  <nav>
    <button data-v="prep" aria-pressed="true" data-t="vPrep"></button>
    <button data-v="rep" aria-pressed="false" data-t="vRep"></button>
    <button data-v="calc" aria-pressed="false" data-t="vCalc"></button>
    <button data-v="set" aria-pressed="false" data-t="vSet"></button>
    <span class="sp"></span>
    <span class="lang"><button data-lang="uz">UZ</button><button data-lang="ru">RU</button></span>
    <button id="prtBtn" style="border-radius:10px;padding:8px 14px;margin-bottom:8px;border:1.5px solid rgba(255,255,255,.3)" data-t="print"></button>
  </nav>
</header>

<main id="vPrep">
  <!-- ===== CHAP: KIRITISH ===== -->
  <div>
    <div class="card">
      <h2><span class="n">1</span><span data-t="h1"></span></h2>
      <div class="grid3">
        <div><label for="g" data-t="grade"></label><div class="inp"><select id="g"></select></div></div>
        <div><label for="M" data-t="amount"></label><div class="inp"><input id="M" inputmode="decimal" value="300"><span data-t="u_t"></span></div></div>
        <div><label for="tv" data-t="targetV"></label><div class="inp"><input id="tv" inputmode="decimal"><span>cSt</span></div></div>
      </div>
      <div class="norm" id="norm"></div>
    </div>

    <div class="card">
      <h2><span class="n">2</span><span data-t="h2"></span></h2>
      <div class="comp">
        <div class="thd"><div class="t" id="nA">1-komponent</div><label class="restl"><span data-t="rest"></span><span class="inp"><span class="pre">→</span><input id="rA" inputmode="decimal" placeholder="30"><span data-t="u_cm"></span></span></label></div>
        <div class="trow">
          <div class="inp"><select id="tA"></select></div>
          <div class="tr3">
            <div class="lbls"><span data-t="lZs"></span><span data-t="lZe"></span><span data-t="visc"></span></div>
            <div class="inp"><input id="zA" inputmode="decimal"><span data-t="u_cm"></span></div>
            <div class="inp out1" id="eWA"><span class="pre">→</span><input id="eA" readonly tabindex="-1"><span data-t="u_cm"></span></div>
            <div class="inp"><input id="vA" inputmode="decimal"><span>cSt</span></div>
          </div>
        </div>
        <div id="dAw" hidden style="margin-top:8px"><label for="dA" data-t="dens"></label><div class="inp"><input id="dA" inputmode="decimal"><span>t/m³</span></div></div>
        <div class="rz" id="rzA"></div>
        <div id="xA"></div>
        <button class="mini" id="addA" data-t="addTank" style="margin-top:10px"></button>
      </div>
      <div class="comp b">
        <div class="thd"><div class="t" id="nB">2-komponent</div><label class="restl"><span data-t="rest"></span><span class="inp"><span class="pre">→</span><input id="rB" inputmode="decimal" placeholder="30"><span data-t="u_cm"></span></span></label></div>
        <div class="trow">
          <div class="inp"><select id="tB"></select></div>
          <div class="tr3">

<script>
/* ===================== YORDAMCHI ===================== */
const $=id=>document.getElementById(id),K=0.8;

const num=id=>{const v=String($(id).value).trim().replace(/\s/g,'').replace(',','.');return v===''?NaN:Number(v)};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getLS(k,d){try{const v=JSON.parse(localStorage.getItem(k)||'null');return v==null?d:v}catch(e){return d}}
function setLS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

/* ===================== KALIBROVKA (to'liq versiya bilan bir xil) ===================== */
const unitMul=t=>(t.unit==='mm'?10:1);
const isT=t=>t.res==='t';
// maks. zamer kiritilmagan rezervuarlar uchun standart (9 m = 900 sm) — shundan yuqorisi toshib ketadi
const DEF_MAXH=900;
const mxH=t=>t&&t.maxH>0?t.maxH:(t&&t.unit==='mm'?DEF_MAXH*10:DEF_MAXH);
// rezervuarning eng yuqori ruxsat etilgan zameri (kalibrovka jadvali bo'lsa - jadval oxiri)
const topH=t=>t.type==='coef'?mxH(t):(t.rows&&t.rows.length?t.rows[t.rows.length-1][0]:NaN);
function capV(t){if(t.type==='coef')return mxH(t)*unitMul(t)*t.k;const r=t.rows;return r.length?r[r.length-1][1]:NaN}
function vol(t,h){
  if(!(h>=0))return NaN;
  if(t.type==='coef'){if(h>mxH(t)+1e-9)return NaN;return h*unitMul(t)*t.k}
  const r=t.rows;if(r.length<2||h<r[0][0]||h>r[r.length-1][0])return NaN;
  for(let i=1;i<r.length;i++)if(h<=r[i][0]){const[h0,v0]=r[i-1],[h1,v1]=r[i];return h1===h0?v1:v0+(h-h0)*(v1-v0)/(h1-h0)}
  return r[r.length-1][1];
}
function hgt(t,v){
  if(!(v>=-1e-9))return NaN;v=Math.max(0,v);
  if(t.type==='coef'){const per=unitMul(t)*t.k;if(!(per>0))return NaN;const h=v/per;return(h>mxH(t)+1e-9)?NaN:h}
  const r=t.rows;if(r.length<2||v<r[0][1]||v>r[r.length-1][1])return NaN;
  for(let i=1;i<r.length;i++)if(v<=r[i][1]){const[h0,v0]=r[i-1],[h1,v1]=r[i];return v1===v0?h0:h0+(v-v0)*(h1-h0)/(v1-v0)}
  return r[r.length-1][0];
}

const PRESET_TANKS=[

const PRESET_GRADES=[
  {name:"И-12А",compA:"1-fraksiya",compB:"2-fraksiya",vMin:13,vMax:21},
  {name:"И-20А",compA:"2-fraksiya",compB:"3-fraksiya",vMin:25,vMax:35},

  {name:"И-50А",compA:"3-fraksiya",compB:"Ost. masla",vMin:75,vMax:95}];
let tanks=getLS('visc_tanks',[]),grades=getLS('visc_grades',null),arch=getLS('visc_arch',[]);
if(!Array.isArray(tanks)||!tanks.length){tanks=PRESET_TANKS.map((p,i)=>({id:'t'+Date.now()+'_'+i,name:p.name,type:'coef',unit:'cm',res:'t',k:p.k,maxH:p.maxH,dead:30,role:p.dst?'dst':'src',park:p.park,product:p.product,rows:[]}));setLS('visc_tanks',tanks)}
if(!Array.isArray(grades)||!grades.length){grades=PRESET_GRADES.map((g,i)=>({id:'g'+(i+1),...g}));setLS('visc_grades',grades)}
if(!Array.isArray(arch))arch=[];
const byName=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true});
const FIELDS=['M','tv','zA','vA','dA','zB','vB','dB','zC','vC','dC'],SELS=['g','tA','tB','tC'];
let st=getLS('visc_pc',{});
let last=null;


/* ===================== MATNLAR (UZ / RU) ===================== */
const TT={
 uz:{title:"Yog' tayyorlash",unit:"57/1.2 qurilmasi · 3-sex",vPrep:"Tayyorlash",vCalc:"Kalkulyatorlar",vSet:"Rezervuar va markalar",addTank:"+ yana rezervuar qo'shish",csvBtn:"Excel ga yuklash",bkBtn:"Zaxira faylini saqlash",rsBtn:"Zaxiradan tiklash",
  bkNever:"Hali zaxira qilinmagan. «Zaxira faylini saqlash» ni bosing va faylni fleshkaga ko'chirib qo'ying.",bkOld:n=>`Oxirgi zaxiradan ${n} kun o'tdi. Yangi zaxira qiling va fleshkaga ko'chiring.`,

  rsErr:"Bu fayl ilovaning zaxira fayli emas.",rsQ:(a,t,g)=>`Zaxirada: arxivda ${a} ta yozuv, ${t} ta rezervuar, ${g} ta marka.\nRezervuar va markalar zaxiradagi bilan almashtiriladi, arxiv qo'shib qo'yiladi. Davom etilsinmi?`,

  rd.onload=()=>{let o;try{o=JSON.parse(rd.result)}catch(e){o=null}
    if(!o||o.app!=='yog-tayyorlash'||!Array.isArray(o.tanks)||!Array.isArray(o.grades)||!Array.isArray(o.arch)){$('bkMsg').innerHTML=`<div class="msg">${t.rsErr}</div>`;return}
    askYes(t.rsQ(o.arch.length,o.tanks.length,o.grades.length),()=>{
    tanks=o.tanks;grades=o.grades;setLS('visc_tanks',tanks);setLS('visc_grades',grades);
    if(Array.isArray(o.adds)){adds=o.adds;setLS('visc_adds',adds);renderAd()}
    arch=getLS('visc_arch',[]);if(!Array.isArray(arch))arch=[];
    const have=new Set(arch.map(r=>r.id));let n=0;
    o.arch.forEach(r=>{if(r&&r.id&&!have.has(r.id)){arch.push(r);n++}});
    arch.sort((a,b)=>b.ts-a.ts);setLS('visc_arch',arch);
    fillAll();calc();renderArc();if(st.view==='set')renderSet();
    $('bkMsg').innerHTML=`<div class="okmsg">${t.rsOk(n,arch.length)}</div>`})};
  rd.readAsText(file)}
function exportCSV(){const t=tr();if(!arch.length){$('bkMsg').innerHTML=`<div class="msg">${t.rNone}</div>`;return}
  const name=`yog_arxiv_${today()}.xlsx`;
  XL.save(name,[xlRecSheet(t.xArc,t.xArcT,arch.slice().sort((a,b)=>a.ts-b.ts))]);
  $('bkMsg').innerHTML=`<div class="okmsg">${t.csvOk(name)}</div>`}
$('bkBtn').onclick=backup;$('csvBtn').onclick=exportCSV;
$('rsBtn').onclick=()=>{$('rsFile').value='';$('rsFile').click()};
$('rsFile').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)restore(f)});

/* ===================== IMPORT ===================== */
$('setBtn').onclick=()=>{$('imMsg').innerHTML='';$('dlg').showModal()};
$('dlgClose').onclick=()=>$('dlg').close();
$('imBtn').onclick=()=>{
  let o;try{o=JSON.parse($('imTxt').value)}catch(e){o=null}
  const tk=o&&(Array.isArray(o)?o:o.tanks),gr=o&&!Array.isArray(o)?o.grades:null;
  const okTk=Array.isArray(tk)&&tk.every(x=>x&&x.id&&x.name&&((x.type==='coef'&&x.k>0)||(x.type==='table'&&Array.isArray(x.rows)&&x.rows.length>=2)));
  if(!okTk){$('imMsg').innerHTML=`<div class="msg">${tr().imErr}</div>`;return}
  tanks=tk;setLS('visc_tanks',tanks);
  if(Array.isArray(gr)&&gr.length){grades=gr;setLS('visc_grades',grades)}
  fillAll();calc();if(st.view==='set')renderSet();$('imMsg').innerHTML=`<div class="okmsg">${tr().imOk(tanks.length,Array.isArray(gr)?gr.length:null)}</div>`;
};

/* ===================== KALKULYATORLAR ===================== */
const OUT=(lb,v,u,extra='')=>`<div class="lb">${lb}</div><div class="vv">${v}<small> ${u}</small></div>${extra}`;
const ERR=m=>`<div class="msg" style="margin:0">${m}</div>`;
let c2res=null;
function calcTools(){
  const t0=tr();
  ['c1A','c1p','c1B','c2A','c2B','c2t','c2M','kM','kv','kt','kc'].forEach(i=>st[i]=$(i).value);setLS('visc_pc',st);
  // 1) foiz -> qovushqoqlik
  const a=num('c1A'),p=num('c1p'),b=num('c1B');
  if(!(a>0&&b>0)||isNaN(p))$('c1o').innerHTML='';
  else if(p<0||p>100)$('c1o').innerHTML=ERR(t0.pctErr);
  else $('c1o').innerHTML=OUT(t0.mixV,fmt(Linv(p/100*L(a)+(1-p/100)*L(b)),2),'cSt');
  // 2) qovushqoqlik -> foiz
  const A=num('c2A'),B=num('c2B'),t=num('c2t'),M=num('c2M');c2res=null;
  if(!(A>0&&B>0&&t>0))$('c2o').innerHTML='';
  else if(Math.abs(A-B)<1e-9||t<Math.min(A,B)||t>Math.max(A,B))$('c2o').innerHTML=ERR(t0.tgtErr(fmt(Math.min(A,B),2),fmt(Math.max(A,B),2)));
  else{const pa=(L(t)-L(B))/(L(A)-L(B))*100;c2res={A,B,t,M};
    $('c2o').innerHTML=`<div class="f2" style="margin:0"><div>${OUT(t0.compA,fmt(pa,1),'%',M>0?`<div>${fmt(M*pa/100,1)} ${tr().u_t}</div>`:'')}</div><div>${OUT(t0.compB,fmt(100-pa,1),'%',M>0?`<div>${fmt(M*(100-pa)/100,1)} ${tr().u_t}</div>`:'')}</div></div>`}
  $('c2Go').disabled=!c2res;
  // 3) tuzatish
  const kM=num('kM'),kv=num('kv'),kt=num('kt'),kc=num('kc');
  if(!(kM>0&&kv>0&&kt>0&&kc>0))$('ko').innerHTML=`<div class="lb">${t0.kNeed}</div>`;
  else if(Math.abs(kv-kt)<1e-9)$('ko').innerHTML=`<div class="okmsg" style="margin:0">${t0.kSame}</div>`;
  else if(kv>kt&&!(kc<kt))$('ko').innerHTML=ERR(t0.kLight(fmt(kt,2)));
  else if(kv<kt&&!(kc>kt))$('ko').innerHTML=ERR(t0.kHeavy(fmt(kt,2)));
  else{const x=kM*(L(kv)-L(kt))/(L(kt)-L(kc));
    $('ko').innerHTML=OUT(t0.kAdd,fmt(x,1),tr().u_t,`<div class="line"><span>${t0.kNew}</span><b>${fmt(kM+x,1)} ${tr().u_t}</b></div><div class="line"><span>${t0.kRes}</span><b>${fmt(Linv((kM*L(kv)+x*L(kc))/(kM+x)),2)} cSt</b></div>`)}
}
function setView(v){st.view=v;setLS('visc_pc',st);
  $('vPrep').hidden=v!=='prep';$('vCalc').hidden=v!=='calc';$('vSet').hidden=v!=='set';$('vRep').hidden=v!=='rep';if(v==='set')renderSet();if(v==='rep')renderRep();
  document.querySelectorAll('nav [data-v]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v))}
function tick(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('clk').textContent=`${p(d.getHours())}:${p(d.getMinutes())}`;
  const t=tr();$('dte').textContent=t.date(d.getDate(),t.months[d.getMonth()],d.getFullYear())}

/* ===================== REZERVUAR VA MARKALAR ===================== */
let edTk=null,edRole='src',edGr=null;
function renderSet(){const t=tr();
  const key=x=>x.role==='dst'?'~dst':(x.park||'~');
  const rk=g=>g==='~dst'?2:(g==='~'?1:0);
  const groups=[...new Set(tanks.map(key))].sort((a,b)=>rk(a)-rk(b)||a.localeCompare(b,undefined,{numeric:true}));
  $('tkList').innerHTML=groups.map(g=>{const l=tanks.filter(x=>key(x)===g).sort(byName);
    const title=g==='~dst'?t.grpDst:(g==='~'?t.grpNoPark:t.grpSrc(esc(g)));
    return `<h3 class="grp"><i class="${g==='~dst'?'d':''}"></i>${title}</h3>`+l.map(x=>`<div class="it"><div><div class="nm">${esc(x.name)}${x.product?`<span class="pr">${esc(PN(x.product))}</span>`:''}</div>
      <div class="ds">${x.type==='coef'?t.tkDesc(fmt(x.k,3),mxH(x),x.dead||0)+(x.maxH>0?'':t.defMx):t.tbl}${x.visc>0?` · <b>${fmt(x.visc,2)} cSt</b>`:''}</div></div>
      <div class="ac"><button class="mini" data-ed="${x.id}">${t.edit}</button><button class="mini del" data-del="${x.id}">${t.del}</button></div></div>`).join('')}).join('');
  $('tkList').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>openTk(tanks.find(x=>x.id===b.dataset.ed)));
  $('tkList').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const x=tanks.find(y=>y.id===b.dataset.del);
    if(x)askYes(t.delQ(x.name),()=>{tanks=tanks.filter(y=>y.id!==x.id);setLS('visc_tanks',tanks);fillAll();calc();renderSet()})});
  renderAdSet();
  $('grList').innerHTML=grades.map(g=>`<div class="it"><div><div class="nm">${esc(g.name)}</div><div class="ds">${esc(t.grDesc(PN(g.compA)||t.compA,PN(g.compB)||t.compB,fmt(g.vMin,0),fmt(g.vMax,0)))}</div></div>
    <div class="ac"><button class="mini" data-ged="${g.id}">${t.edit}</button><button class="mini del" data-gdel="${g.id}">${t.del}</button></div></div>`).join('');
  $('grList').querySelectorAll('[data-ged]').forEach(b=>b.onclick=()=>openGr(grades.find(x=>x.id===b.dataset.ged)));
  $('grList').querySelectorAll('[data-gdel]').forEach(b=>b.onclick=()=>{const g=grades.find(y=>y.id===b.dataset.gdel);
    if(g)askYes(t.delQ(g.name),()=>{grades=grades.filter(y=>y.id!==g.id);setLS('visc_grades',grades);fillAll();calc();renderSet()})});
  $('dlPark').innerHTML=[...new Set(tanks.map(x=>x.park).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">`).join('');
  $('dlProd').innerHTML=[...new Set(['1-fraksiya','2-fraksiya','3-fraksiya','Ost. masla',...tanks.map(x=>x.product).filter(Boolean),...grades.map(g=>g.name)])].map(v=>`<option value="${esc(v)}">`).join('')}
function setRole(r){edRole=r;$('rSrc').setAttribute('aria-pressed',r==='src');$('rDst').setAttribute('aria-pressed',r==='dst')}
function capPrev(){const k=num('fK'),m=num('fMax')>0?num('fMax'):DEF_MAXH;$('fCap').textContent=k>0&&m>0?tr().capTxt(fmt(k*m,1)):''}
function openTk(x,role){const t=tr();edTk=x||null;
  $('dTkH').textContent=x?t.tkEdit(x.name):t.tkNew;
  $('fName').value=x?x.name:'';$('fPark').value=x?(x.park||''):'';$('fProd').value=x?(x.product||''):'';
  $('fK').value=x&&x.type==='coef'?String(x.k):'';$('fMax').value=x&&x.maxH>0?String(x.maxH):'';$('fDead').value=x?String(x.dead||0):'30';$('fVisc').value=x&&x.visc>0?String(x.visc):'';
  const tbl=x&&x.type!=='coef';$('fK').disabled=tbl;$('fMax').disabled=tbl;
  setRole(x?(x.role==='dst'?'dst':'src'):(role||'src'));$('fMsg').innerHTML='';capPrev();$('dTk').showModal()}
function saveTk(){const t=tr(),name=$('fName').value.trim(),k=num('fK'),mx=num('fMax'),dead=num('fDead');
  const tbl=edTk&&edTk.type!=='coef';
  if(!name||(!tbl&&!(k>0))){$('fMsg').innerHTML=`<div class="msg">${t.tkErr}</div>`;return}
  if(tanks.some(x=>x.name.toLowerCase()===name.toLowerCase()&&(!edTk||x.id!==edTk.id))){$('fMsg').innerHTML=`<div class="msg">${t.tkDup}</div>`;return}
  const base=edTk||{id:'t'+Date.now(),type:'coef',unit:'cm',res:'t',rows:[]};
  const vs=num('fVisc');Object.assign(base,{name,park:$('fPark').value.trim(),product:$('fProd').value.trim(),role:edRole,dead:dead>=0?dead:0,visc:vs>0?vs:null});
  if(!tbl){base.k=k;base.maxH=mx>0?mx:0}
  if(!edTk)tanks.push(base);
  setLS('visc_tanks',tanks);$('dTk').close();fillAll();calc();renderSet()}
function openGr(g){const t=tr();edGr=g||null;
  $('dGrH').textContent=g?t.grEdit(g.name):t.grNew;
  $('gName').value=g?g.name:'';$('gCA').value=g?(g.compA||''):'';$('gCB').value=g?(g.compB||''):'';
  $('gMin').value=g?String(g.vMin):'';$('gMax').value=g?String(g.vMax):'';$('gMsg').innerHTML='';$('dGr').showModal()}
function saveGr(){const t=tr(),name=$('gName').value.trim(),lo=num('gMin'),hi=num('gMax');
  if(!name||!(lo>0)||!(hi>lo)){$('gMsg').innerHTML=`<div class="msg">${t.grErr}</div>`;return}
  const g=edGr||{id:'g'+Date.now()};
  Object.assign(g,{name,compA:$('gCA').value.trim()||t.compA,compB:$('gCB').value.trim()||t.compB,vMin:lo,vMax:hi});
  if(!edGr)grades.push(g);
  setLS('visc_grades',grades);$('dGr').close();fillAll();calc();renderSet()}
$('addSrc').onclick=()=>openTk(null,'src');$('addDst').onclick=()=>openTk(null,'dst');
$('rSrc').onclick=()=>setRole('src');$('rDst').onclick=()=>setRole('dst');
$('fSave').onclick=saveTk;$('fCancel').onclick=()=>$('dTk').close();['fK','fMax'].forEach(i=>$(i).addEventListener('input',capPrev));
$('addGr').onclick=()=>openGr(null);$('gSave').onclick=saveGr;$('gCancel').onclick=()=>$('dGr').close();
$('expBtn').onclick=()=>{const txt=JSON.stringify({tanks,grades}),done=()=>$('expMsg').innerHTML=`<div class="okmsg">${tr().expOk}</div>`;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,()=>prompt('',txt));else prompt('',txt)};

/* ===================== ISHGA TUSHIRISH ===================== */
['c1A','c1p','c1B','c2A','c2B','c2t','c2M','kM','kv','kt','kc'].forEach(i=>{if(st[i]!=null)$(i).value=st[i];$(i).addEventListener('input',calcTools)});
document.querySelectorAll('nav [data-v]').forEach(b=>b.onclick=()=>setView(b.dataset.v));
$('c2Go').onclick=()=>{if(!c2res)return;$('vA').value=String(c2res.A);$('vB').value=String(c2res.B);$('tv').value=String(c2res.t);if(c2res.M>0)$('M').value=String(c2res.M);setView('prep');calc()};
$('prtBtn').onclick=()=>window.print();
applyLang();
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{st.lang=b.dataset.lang;setLS('visc_pc',st);applyLang();fillAll();renderX('A');renderX('B');calc();calcTools();renderArc();renderAd();tick();if(st.view==='set')renderSet();if(st.view==='rep')renderRep()});
tick();setInterval(tick,15000);calcTools();setView(['calc','set','rep'].includes(st.view)?st.view:'prep');
fillAll();
FIELDS.forEach(i=>$(i).addEventListener('input',calc));
SELS.forEach(i=>$(i).addEventListener('change',()=>{if(i==='g')clearTanks();else tankVisc(i);calc()}));
// marka almashsa: pastdagi rezervuarlar tozalanadi, operator o'zi tanlaydi
function clearTanks(){$('tv').value='';['tA','tB','tC'].forEach(i=>$(i).value='');
  ['zA','vA','rA','dA','zB','vB','rB','dB','dC','vC'].forEach(i=>$(i).value='');$('zC').value='0';
  st.xA=[];st.xB=[];renderX('A');renderX('B');renderAd()}
$('saveBtn').onclick=saveArc;$('shiftBtn').onclick=shift;
renderAd();
$('addAd').onclick=()=>{const L=adRows();if(L.length>=8)return;L.push({a:'',p:'',kg:''});setLS('visc_pc',st);renderAd()};
$('adNew').onclick=()=>{adds.push({id:'ad'+Date.now(),name:tr().adName+' '+(adds.length+1),dose:0});setLS('visc_adds',adds);renderAdSet();renderAd();const e=$('adSet').querySelector(`[data-si="${adds.length-1}"][data-sf="name"]`);if(e){e.focus();e.select()}};
['A','B'].forEach(c=>{if(!Array.isArray(st['x'+c]))st['x'+c]=[];renderX(c);
  $('add'+c).onclick=()=>{if(st['x'+c].length>=5)return;st['x'+c].push({tank:'',z:'',r:'',v:''});setLS('visc_pc',st);renderX(c)}});
(()=>{const n=new Date(),p=x=>String(x).padStart(2,'0');$('rPer').value=st.rPer||`${n.getFullYear()}-${p(n.getMonth()+1)}`;$('rYr').value=st.rYr||n.getFullYear();
  $('rmM').onclick=()=>{st.rMode='m';renderRep()};$('rmY').onclick=()=>{st.rMode='y';renderRep()};
  $('rPer').addEventListener('change',renderRep);$('rYr').addEventListener('input',renderRep);
  $('rCopy').onclick=repCopy;$('rCsv').onclick=repCsv;$('rPrint').onclick=()=>window.print();
  $('aSave').onclick=saveArcEd;$('aCancel').onclick=()=>$('dArc').close();$('aDel').onclick=delArc;$('pinBtn').onclick=changePin})();
$('rA').value='';$('rB').value='';delete st.rA;delete st.rB;
renderArc();calc();if(st.view==='rep')renderRep();
</script>
